# Copia este archivo a cloudrun.env.yaml (está en .gitignore), rellena los valores y NO lo subas a GitHub.
# Formato YAML de `gcloud run deploy --env-vars-file`: todos los valores entre comillas.
DATABASE_URL: "postgresql://usuario:clave@host/neondb?sslmode=require"   # cadena de Neon
SECRET_KEY: "una-cadena-larga-y-aleatoria"                                 # openssl rand -hex 32
COOKIE_SECURE: "true"
ALLOW_REGISTRATION: "true"
APP_BASE_URL: "https://mealtous-XXXXXXXX-ew.a.run.app"                     # la URL que te da Cloud Run
LLM_PROVIDER: "openai"
