name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Construir imágenes (docker compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Construye backend y frontend tal como los define docker-compose.yml
      - name: Build
        run: docker compose build
        env:
          SECRET_KEY: clave-solo-para-ci
