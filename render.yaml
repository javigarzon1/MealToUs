# Despliegue gratuito en Render: un solo servicio web (backend + web) y la base de datos en Neon.
# Las claves marcadas con sync: false se piden al crear el Blueprint en el panel de Render.
services:
  - type: web
    name: mealtous
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free               # se duerme tras 15 min sin visitas y tarda cerca de un minuto en despertar
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false          # cadena de conexión de Neon (postgresql://...)
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_MAX_TOKENS
        value: "5000"        # Groq gratuito: 8000 tokens/minuto; Groq cuenta lo que se pide
      - key: OPENAI_API_KEY
        sync: false          # clave de Groq
      # Segundo proveedor, solo para la lista de la compra (Gemini por su API compatible con OpenAI)
      - key: SHOPPING_LLM_PROVIDER
        value: openai
      - key: SHOPPING_LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai/
      - key: SHOPPING_LLM_MODEL
        sync: false          # nombre exacto de un modelo Gemini
      - key: SHOPPING_LLM_API_KEY
        sync: false          # clave de Gemini
      - key: APP_BASE_URL
        sync: false          # URL pública, p. ej. https://mealtous.onrender.com
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
