<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Fondo circular con gradiente -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGrad)" />
  
  <!-- Plato -->
  <circle cx="100" cy="100" r="60" fill="url(#plateGrad)" stroke="#e0e0e0" stroke-width="3" />
  <circle cx="100" cy="100" r="50" fill="none" stroke="#e0e0e0" stroke-width="1" />
  
  <!-- Tenedor (izquierda) -->
  <g transform="translate(55, 70)">
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#424242" />
    <rect x="0" y="0" width="4" height="15" rx="2" fill="#424242" />
    <rect x="8" y="0" width="4" height="15" rx="2" fill="#424242" />
    <rect x="16" y="0" width="4" height="15" rx="2" fill="#424242" />
  </g>
  
  <!-- Cuchillo (derecha) -->
  <g transform="translate(125, 70)">
    <rect x="0" y="0" width="4" height="60" rx="2" fill="#424242" />
    <path d="M0,0 L12,0 L12,15 L0,15 Z" fill="#424242" />
  </g>
  
  <!-- Hoja de ensalada -->
  <g transform="translate(85, 85)">
    <ellipse cx="15" cy="15" rx="12" ry="8" fill="#4caf50" transform="rotate(-20 15 15)" />
    <ellipse cx="25" cy="20" rx="10" ry="6" fill="#66bb6a" transform="rotate(15 25 20)" />
  </g>
  
  <!-- Tomate -->
  <circle cx="110" cy="95" r="8" fill="#e53935" />
  <path d="M110,87 L112,83 L108,83 Z" fill="#4caf50" />
  
  <!-- Texto -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="white">
    MealToUs
  </text>
</svg>