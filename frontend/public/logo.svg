<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MealToUs">
  <style>
    .eye{transform-box:fill-box;transform-origin:center;animation:b 4s infinite}
    @keyframes b{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @media (prefers-reduced-motion:reduce){.eye{animation:none}}
  </style>
  <ellipse cx="60" cy="113" rx="28" ry="4" fill="#3B2A1D" opacity=".14"/>
  <!-- patas -->
  <rect x="36" y="106" width="9" height="8" rx="3" fill="#3B2A1D"/><rect x="75" y="106" width="9" height="8" rx="3" fill="#3B2A1D"/>
  <!-- cuerpo de nevera -->
  <rect x="28" y="6" width="64" height="102" rx="15" fill="#8FD3C8" stroke="#3B2A1D" stroke-width="4"/>
  <!-- congelador (puerta de arriba) con pantalla de movil -->
  <rect x="35" y="13" width="50" height="38" rx="9" fill="#fff" stroke="#3B2A1D" stroke-width="3"/>
  <rect x="52" y="16" width="16" height="4" rx="2" fill="#3B2A1D"/>
  <circle class="eye" cx="51" cy="33" r="3.6" fill="#3B2A1D"/><circle class="eye" cx="69" cy="33" r="3.6" fill="#3B2A1D"/>
  <path d="M53 41q7 6 14 0" fill="none" stroke="#3B2A1D" stroke-width="3.2" stroke-linecap="round"/>
  <circle cx="45" cy="39" r="2.6" fill="#FF9D94"/><circle cx="75" cy="39" r="2.6" fill="#FF9D94"/>
  <!-- division y puerta de abajo -->
  <path d="M28 56h64" stroke="#3B2A1D" stroke-width="4"/>
  <!-- tiradores verticales -->
  <rect x="38" y="60" width="5" height="16" rx="2.5" fill="#3B2A1D"/>
  <rect x="38" y="26" width="0" height="0"/>
  <!-- iman en la puerta -->
  <path d="M68 70c8 1 10 11 5 17-8-1-10-11-5-17z" fill="#3FAE6A"/>
  <circle cx="56" cy="88" r="6" fill="#FF6B3D"/><path d="M56 82q0-4 3-5" stroke="#3FAE6A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- boton de inicio de movil -->
  <circle cx="60" cy="100" r="3" fill="none" stroke="#3B2A1D" stroke-width="2.4"/>
</svg>
