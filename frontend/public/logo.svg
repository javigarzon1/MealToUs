<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MealToUs">
  <style>
    .jump{animation:jump 3.2s ease-in-out infinite;transform-origin:60px 112px}
    .blink{animation:blink 3.6s infinite;transform-box:fill-box;transform-origin:center}
    .flake{animation:flake 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .sh{animation:sh 3.2s ease-in-out infinite;transform-origin:center}
    .hand{animation:hand 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes jump{0%,45%,100%{transform:translateY(0) scale(1,1)}12%{transform:translateY(0) scale(1.05,.94)}24%{transform:translateY(-7px) scale(.97,1.04)}36%{transform:translateY(0) scale(1.05,.95)}42%{transform:translateY(0) scale(.99,1.01)}}
    @keyframes sh{0%,45%,100%{transform:scale(1)}24%{transform:scale(.8)}}
    @keyframes blink{0%,90%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}
    @keyframes hand{0%,45%,100%{transform:translateY(0)}24%{transform:translateY(-2px)}}
    @keyframes flake{0%,100%{transform:rotate(-8deg) scale(1)}50%{transform:rotate(8deg) scale(1.06)}}
    @media (prefers-reduced-motion:reduce){.jump,.blink,.flake,.sh,.hand{animation:none}}
  </style>
  <g transform="translate(60 66) scale(.86) translate(-60 -62)">
    <ellipse class="sh" cx="60" cy="114" rx="30" ry="4" fill="#3b2a1d" opacity=".14"/>
    <g class="jump">
      <rect x="38" y="104" width="10" height="8" rx="3" fill="#3b2a1d"/>
      <rect x="72" y="104" width="10" height="8" rx="3" fill="#3b2a1d"/>
      <rect x="26" y="6" width="68" height="100" rx="16" fill="#8FD3C8" stroke="#3b2a1d" stroke-width="4"/>
      <!-- puerta superior = pantalla -->
      <rect x="33" y="13" width="54" height="36" rx="10" fill="#fff"/>
      <rect x="51" y="8" width="18" height="5" rx="2.5" fill="#3b2a1d"/>
      <g class="blink"><circle cx="50" cy="28" r="4" fill="#3b2a1d"/><circle cx="66" cy="28" r="4" fill="#3b2a1d"/></g>
      <path d="M52 37q6 6 12 0" fill="none" stroke="#3b2a1d" stroke-width="3.5" stroke-linecap="round"/>
      <circle cx="44" cy="36" r="3" fill="#ff9d94"/><circle cx="72" cy="36" r="3" fill="#ff9d94"/>
      <path d="M26 55h68" stroke="#3b2a1d" stroke-width="4"/>
      <!-- tiradores -->
      <rect x="79" y="22" width="5" height="16" rx="2.5" fill="#3b2a1d"/>
      <rect class="hand" x="79" y="63" width="5" height="30" rx="2.5" fill="#3b2a1d"/>
      <!-- copo grande en la puerta de abajo -->
      <g class="flake" fill="none" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M53 63v32M37 79h32M42 68l22 22M64 68L42 90"/>
        <path d="M48.500 65l4.500 4.500 4.500-4.500M48.500 93l4.500-4.500 4.500 4.500M40 74.500l4.500 4.500-4.500 4.500M66 74.500l-4.500 4.500 4.500 4.500"/>
      </g>
    </g>
  </g>
</svg>
