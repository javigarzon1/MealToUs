<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="MealToUs">
  <style>
    .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:60px 112px}
    .blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
    @keyframes bob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
    @keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    @media (prefers-reduced-motion:reduce){.bob,.blink{animation:none}}
  </style>
  <ellipse cx="60" cy="114" rx="30" ry="4" fill="#3b2a1d" opacity=".14"/>
  <g class="bob">
    <rect x="38" y="104" width="10" height="8" rx="3" fill="#3b2a1d"/>
    <rect x="72" y="104" width="10" height="8" rx="3" fill="#3b2a1d"/>
    <rect x="26" y="6" width="68" height="100" rx="16" fill="#8FD3C8" stroke="#3b2a1d" stroke-width="4"/>
    <!-- puerta del congelador = pantalla del móvil -->
    <rect x="33" y="13" width="54" height="36" rx="10" fill="#fff"/>
    <rect x="51" y="8" width="18" height="5" rx="2.5" fill="#3b2a1d"/>
    <g class="blink"><circle cx="50" cy="28" r="4" fill="#3b2a1d"/><circle cx="66" cy="28" r="4" fill="#3b2a1d"/></g>
    <path d="M52 37q6 6 12 0" fill="none" stroke="#3b2a1d" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="44" cy="36" r="3" fill="#ff9d94"/><circle cx="72" cy="36" r="3" fill="#ff9d94"/>
    <!-- junta entre puertas -->
    <path d="M26 55h68" stroke="#3b2a1d" stroke-width="4"/>
    <!-- tiradores -->
    <rect x="78" y="22" width="5" height="16" rx="2.5" fill="#3b2a1d"/>
    <rect x="78" y="62" width="5" height="26" rx="2.5" fill="#3b2a1d"/>
    <!-- imanes en la puerta -->
    <circle cx="46" cy="74" r="7" fill="#FF6B3D"/><path d="M46 67c0-3 2-4 4-4" stroke="#3FAE6A" stroke-width="3" stroke-linecap="round" fill="none"/>
    <rect x="40" y="86" width="22" height="9" rx="3" fill="#FFD23F" transform="rotate(-6 51 90)"/>
  </g>
</svg>
